[project]
name = "dashboard-finanzas"
version = "0.1.0"
description = "Dashboard para visualizar acciones financieras."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "streamlit",
    "yfinance",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
